<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Minakshee Narayankar</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .nf { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 28px; padding-block: 64px; }
    .nf > * { grid-column: 1; }
    .nf-code { font: 300 clamp(6rem, 22vw, 16rem)/.85 var(--serif); letter-spacing: -0.06em; }
    .nf-code em { color: var(--accent); font-style: italic; }
    .nf p { max-width: 44ch; font-size: 1.125rem; color: var(--ink-soft); }
  </style>
</head>
<body>
  <main class="wrap nf">
    <p class="section-num"><span>404</span> Not found</p>
    <h1 class="nf-code">4<em>0</em>4</h1>
    <p>This page doesn’t exist, or has moved. The rest of the portfolio is one click away.</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="/">Back to the portfolio <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
